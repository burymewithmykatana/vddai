services:
  api:
    build: .
    container_name: visual_defect_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      TORCH_HOME: /app/artifacts/weights
    command: >-
      sh -c "alembic upgrade head &&
      exec uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/health', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    container_name: visual_defect_worker
    env_file:
      - .env
    environment:
      TORCH_HOME: /app/artifacts/weights
    command: ["python", "-m", "app.workers.prediction_worker"]
    volumes:
      - .:/app
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: visual_defect_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vision_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vision_ai"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7
    container_name: visual_defect_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
  
volumes:
  postgres_data:
