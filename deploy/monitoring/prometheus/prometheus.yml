global:
  scrape_interval: 15s
  scrape_timeout: 3s
  evaluation_interval: 15s

storage:
  tsdb:
    retention:
      time: 7d

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: vddai-api
    static_configs:
      - targets: ["api:9108"]
  - job_name: vddai-worker
    static_configs:
      - targets: ["worker:9109"]
